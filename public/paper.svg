<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <filter id="crumple" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="5" seed="11" stitchTiles="stitch" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2.4" result="light">
      <feDistantLight azimuth="225" elevation="62"/>
    </feDiffuseLighting>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.25" intercept="-0.12"/>
      <feFuncG type="linear" slope="1.25" intercept="-0.12"/>
      <feFuncB type="linear" slope="1.25" intercept="-0.12"/>
    </feComponentTransfer>
  </filter>
  <rect width="900" height="900" filter="url(#crumple)"/>
</svg>
